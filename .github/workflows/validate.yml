name: LIFELINE dataset and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate the complete 50-case workbook
        run: python validator/validate.py cases.xlsx

      - name: Run independent and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate and check negative-fixture validation report
        run: python validator/make_report.py cases.xlsx "$RUNNER_TEMP/validation_report.txt"
